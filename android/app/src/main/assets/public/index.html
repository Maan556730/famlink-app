<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FamLink — Share Your Location</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22FamLink%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230e1117%22%7D">
<meta name="theme-color" content="#0e1117">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0e1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
  .wrap{max-width:420px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 0}
  .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#2f81f7,#1f6feb);
    display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px;box-shadow:0 8px 24px rgba(47,129,247,.3)}
  h1{text-align:center;font-size:24px;margin-bottom:6px}
  .sub{text-align:center;color:#8b949e;font-size:14px;margin-bottom:28px;line-height:1.5}
  label{font-size:13px;color:#8b949e;display:block;margin:14px 0 6px}
  input{width:100%;background:#161b22;border:1px solid #262d3a;color:#e6edf3;padding:14px;
    border-radius:12px;font-size:16px;outline:none}
  input:focus{border-color:#2f81f7}
  .btn{width:100%;background:#2f81f7;border:none;color:#fff;padding:15px;border-radius:12px;
    font-size:16px;font-weight:600;cursor:pointer;margin-top:22px}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:#161b22;border:1px solid #262d3a;color:#e6edf3}
  .live{display:none;text-align:center}
  .live.on{display:block}
  .ring{width:130px;height:130px;border-radius:50%;margin:10px auto 20px;position:relative;
    display:flex;align-items:center;justify-content:center}
  .ring .core{width:96px;height:96px;border-radius:50%;background:rgba(63,185,80,.15);
    display:flex;align-items:center;justify-content:center;font-size:44px}
  .ring .wave{position:absolute;inset:0;border-radius:50%;border:2px solid #3fb950;animation:wave 2s ease-out infinite;opacity:0}
  @keyframes wave{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.35);opacity:0}}
  .stat-row{display:flex;gap:10px;margin:20px 0}
  .st{flex:1;background:#161b22;border:1px solid #262d3a;border-radius:12px;padding:14px 10px}
  .st .l{font-size:11px;color:#8b949e}
  .st .v{font-size:16px;font-weight:600;margin-top:4px}
  .status-txt{color:#3fb950;font-weight:600;margin-bottom:4px;font-size:17px}
  .hidden{display:none!important}
  .msgbox{background:#161b22;border:1px solid #262d3a;border-radius:12px;padding:14px;margin-top:16px;text-align:left}
  .msgbox h3{font-size:13px;color:#8b949e;margin-bottom:10px}
  .msg{background:#1c2230;border-radius:8px;padding:10px;font-size:13px;margin-bottom:8px}
  .msg .t{font-size:10px;color:#8b949e;margin-top:4px}
  .compose{display:flex;gap:8px;margin-top:8px}
  .compose input{padding:10px;flex:1;background:#1c2230;border:1px solid #262d3a;color:#e6edf3;border-radius:9px}
  .compose button{background:#2f81f7;border:none;color:#fff;border-radius:9px;padding:0 16px;font-size:14px;cursor:pointer}
  .err{color:#f85149;font-size:13px;margin-top:10px;text-align:center}
  .pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:999;background:rgba(0,0,0,.5)}
  .pop.show{display:flex}
  .pop .emoji{font-size:90px;animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <!-- Login -->
  <div id="login">
    <div class="logo">💙</div>
    <h1>FamLink</h1>
    <label>Your name</label>
    <input id="name" placeholder="e.g. Papa" autocomplete="name">
    <label>Mobile number</label>
    <input id="number" placeholder="+91…" inputmode="tel" autocomplete="tel">
    <button class="btn" onclick="startLogin()">Start</button>
    <div class="err hidden" id="loginErr"></div>
  </div>

  <!-- Live sharing -->
  <div class="live" id="live">
    <div class="ring"><div class="wave"></div><div class="wave" style="animation-delay:1s"></div><div class="core">📍</div></div>
    <div class="status-txt" id="statusTxt">You're on the map! 🎉</div>
    <div id="whoTxt" style="color:#8b949e;font-size:13px"></div>
    <div class="stat-row">
      <div class="st"><div class="l">Battery</div><div class="v" id="battV">—</div></div>
      <div class="st"><div class="l">Accuracy</div><div class="v" id="accV">—</div></div>
      <div class="st"><div class="l">Updated</div><div class="v" id="updV">—</div></div>
    </div>
    <div class="msgbox">
      <h3>💬 Family chat</h3>
      <div id="msgs"></div>
      <div class="compose">
        <input id="msgIn" placeholder="Reply…">
        <button onclick="sendMsg()">Send</button>
      </div>
    </div>
    <div id="camBadge" class="hidden" style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);border-radius:10px;padding:12px;margin-top:14px;font-size:13px;color:#3fb950">📹 Camera is on — family is viewing. <a onclick="stopCamStream()" style="color:#f85149;cursor:pointer;text-decoration:underline">Turn off</a></div>
    <button class="btn sec" onclick="stopShare()" style="margin-top:18px">Stop sharing</button>
    <div class="err hidden" id="liveErr"></div>
  </div>
</div>
<div class="pop" id="pop"><div class="emoji" id="popEmoji">👋</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL="https://aupesvetijebvaigclvx.supabase.co";
const SUPA_KEY="sb_publishable_g84fUIqasBIrMjQ8cnLtxw_l8DnSB9G";
const params=new URLSearchParams(location.search);
const FAMILY_CODE=params.get("code")||"famnb-9x4k2q";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

let device=null, watchId=null, battRef=null, pollT=null, hbT=null, rotT=null, lastMsgId=0;
try{const s=localStorage.getItem("famlink_dev_"+FAMILY_CODE);if(s)device=JSON.parse(s);}catch(e){}

const CHEERS=["You're on the map! 🎉","Family can see you 💙","Sharing your location 📍","All good — you're connected! ✨","Keeping the family close 🤗"];
function platform(){const u=navigator.userAgent;return /android/i.test(u)?"Android":/iphone|ipad/i.test(u)?"iOS":"Web";}

async function startLogin(){
  const name=document.getElementById("name").value.trim();
  const number=document.getElementById("number").value.trim();
  const err=document.getElementById("loginErr");
  if(!name||!number){err.textContent="Please enter both name and number";err.classList.remove("hidden");return;}
  err.classList.add("hidden");
  try{
    let {data:found}=await sb.from("famlink_devices").select("id")
      .eq("family_code",FAMILY_CODE).eq("number",number).limit(1);
    let id;
    if(found&&found.length){id=found[0].id;
      await sb.from("famlink_devices").update({name,platform:platform()}).eq("id",id);
    }else{
      let {data:ins,error}=await sb.from("famlink_devices")
        .insert({family_code:FAMILY_CODE,name,number,platform:platform(),online:true,last_seen:new Date().toISOString()})
        .select("id").single();
      if(error)throw error; id=ins.id;
    }
    device={id,name,number};
    localStorage.setItem("famlink_dev_"+FAMILY_CODE,JSON.stringify(device));
    beginShare();
  }catch(e){err.textContent="Connection error: "+(e.message||e);err.classList.remove("hidden");}
}

function beginShare(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("live").classList.add("on");
  document.getElementById("whoTxt").textContent=device.name+" · "+(device.number||"");
  if(navigator.getBattery){navigator.getBattery().then(b=>{battRef=b;updBatt();
    b.addEventListener("levelchange",updBatt);b.addEventListener("chargingchange",updBatt);});}
  if(!navigator.geolocation){showLiveErr("This browser doesn't support location");return;}
  watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  hbT=setInterval(heartbeat,15000);
  pollT=setInterval(loadMsgs,6000);
  let ci=0;rotT=setInterval(()=>{ci=(ci+1)%CHEERS.length;document.getElementById("statusTxt").textContent=CHEERS[ci];},4000);
  loadMsgs(true);
  initRTC();
}

// ---- Live camera (WebRTC, phone = sender) ----
let pc=null, rtcCh=null, camStream=null;
const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:global.stun.twilio.com:3478"}];
function initRTC(){
  rtcCh=sb.channel("rtc-"+device.id,{config:{broadcast:{self:false}}});
  rtcCh.on("broadcast",{event:"signal"},({payload})=>onSignal(payload));
  rtcCh.subscribe();
}
async function onSignal(p){
  if(p.type==="request"){await startCamStream();}
  else if(p.type==="answer"&&pc){try{await pc.setRemoteDescription(p.sdp);}catch(e){}}
  else if(p.type==="ice"&&p.from==="dash"&&pc){try{await pc.addIceCandidate(p.candidate);}catch(e){}}
  else if(p.type==="stop"){stopCamStream();}
}
async function startCamStream(){
  if(pc)return;
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});}
  catch(e){try{camStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}catch(e2){return;}}
  document.getElementById("camBadge").classList.remove("hidden");
  pc=new RTCPeerConnection({iceServers:ICE});
  camStream.getTracks().forEach(t=>pc.addTrack(t,camStream));
  pc.onicecandidate=e=>{if(e.candidate)sigP({type:"ice",from:"phone",candidate:e.candidate});};
  const o=await pc.createOffer();await pc.setLocalDescription(o);
  sigP({type:"offer",from:"phone",sdp:o});
}
function stopCamStream(){
  if(pc){pc.close();pc=null;}
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  document.getElementById("camBadge").classList.add("hidden");
}
function sigP(payload){if(rtcCh)rtcCh.send({type:"broadcast",event:"signal",payload});}
function updBatt(){if(!battRef)return;const lvl=Math.round(battRef.level*100);
  document.getElementById("battV").textContent=lvl+"%"+(battRef.charging?" ⚡":"");}

async function onPos(p){
  const lvl=battRef?Math.round(battRef.level*100):null;
  document.getElementById("accV").textContent="±"+Math.round(p.coords.accuracy)+"m";
  document.getElementById("updV").textContent="now";
  const row={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,
    speed:p.coords.speed||0,online:true,last_seen:new Date().toISOString()};
  if(lvl!=null){row.battery=lvl;row.charging=battRef.charging;}
  try{
    await sb.from("famlink_devices").update(row).eq("id",device.id);
    await sb.from("famlink_locations").insert({device_id:device.id,lat:row.lat,lng:row.lng,accuracy:row.accuracy});
  }catch(e){}
}
function onPosErr(e){
  if(e.code===1)showLiveErr("Location permission denied. Please allow location in your browser settings, then refresh this page.");
  else showLiveErr("Couldn't get location ("+e.message+")");
}
async function heartbeat(){
  const row={online:true,last_seen:new Date().toISOString()};
  if(battRef)row.battery=Math.round(battRef.level*100);
  try{await sb.from("famlink_devices").update(row).eq("id",device.id);}catch(e){}
}
function showLiveErr(m){const el=document.getElementById("liveErr");el.textContent=m;el.classList.remove("hidden");
  document.getElementById("statusTxt").textContent="Paused";document.getElementById("statusTxt").style.color="#f85149";clearInterval(rotT);}

async function loadMsgs(first){
  try{
    let {data}=await sb.from("famlink_messages").select("*").eq("device_id",device.id)
      .order("created_at",{ascending:false}).limit(10);
    const arr=(data||[]).reverse();
    const box=document.getElementById("msgs");box.innerHTML="";
    arr.forEach(m=>{
      const d=document.createElement("div");d.className="msg";
      d.innerHTML=(m.direction==="out"?"👨‍👩‍👧 Family: ":"🙋 You: ")+escapeHtml(m.body)+
        '<div class="t">'+new Date(m.created_at).toLocaleTimeString()+'</div>';
      box.appendChild(d);
    });
    // fun pop for new incoming (from family)
    const newest=arr.filter(m=>m.direction==="out").slice(-1)[0];
    if(newest&&newest.id>lastMsgId){
      if(!first){popFun(newest.body);}
      lastMsgId=newest.id;
    }
  }catch(e){}
}
function popFun(body){
  let e="💌";if(/wave|👋/i.test(body))e="👋";else if(/ring|🔔/i.test(body))e="🔔";else if(/love|💙/i.test(body))e="💙";
  document.getElementById("popEmoji").textContent=e;
  const pop=document.getElementById("pop");pop.classList.add("show");
  if(navigator.vibrate)navigator.vibrate([120,60,120]);
  setTimeout(()=>pop.classList.remove("show"),1400);
}
async function sendMsg(){
  const i=document.getElementById("msgIn");const b=i.value.trim();if(!b)return;
  i.value="";
  try{await sb.from("famlink_messages").insert({device_id:device.id,family_code:FAMILY_CODE,direction:"in",body:b});loadMsgs();}catch(e){}
}
function escapeHtml(s){return(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function stopShare(){
  if(watchId)navigator.geolocation.clearWatch(watchId);
  clearInterval(hbT);clearInterval(pollT);clearInterval(rotT);
  stopCamStream();if(rtcCh){sb.removeChannel(rtcCh);rtcCh=null;}
  try{await sb.from("famlink_devices").update({online:false}).eq("id",device.id);}catch(e){}
  localStorage.removeItem("famlink_dev_"+FAMILY_CODE);
  location.reload();
}
window.addEventListener("beforeunload",()=>{
  try{navigator.sendBeacon&&sb.from("famlink_devices").update({online:false}).eq("id",device.id);}catch(e){}
});

if(device&&device.id){beginShare();}
</script>
</body>
</html>
